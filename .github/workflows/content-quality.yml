name: Content quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate repository structure, links, and sources
        run: python3 scripts/validate_repo.py
      - name: Validate runnable case-pack contract and artifacts
        run: python3 scripts/validate_case_packs.py
      - name: Lint Markdown with repository-specific rules
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md" "#node_modules"
      - name: Compile maintenance scripts
        run: python3 -m py_compile scripts/*.py
